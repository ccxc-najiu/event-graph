[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eventgraph-world"
version = "0.1.0"
description = "An event-centred graph for predefined virtual-world events"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
include = ["eventgraph*"]

[tool.setuptools.package-data]
eventgraph = ["web/*.html", "web/*.css", "web/*.js"]
